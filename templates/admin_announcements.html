{% extends "layout.html" %}

{% block content %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Announcements</h2>
            <p class="text-muted mb-0">
                Create and manage announcements
            </p>
        </div>

        <button
            class="btn btn-primary"
            onclick="openCreateModal()"
        >
            + New Announcement
        </button>
    </div>


    <!-- Announcement List -->

    <div id="announcementContainer">

        <div class="text-center py-5">
            <div class="spinner-border"></div>
            <p class="mt-2">Loading announcements...</p>
        </div>

    </div>

</div>


<!-- ========================================================= -->
<!-- CREATE / EDIT MODAL -->
<!-- ========================================================= -->

<div
    class="modal fade"
    id="announcementModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle"
                >
                    Create Announcement
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <form id="announcementForm">

                    <input
                        type="hidden"
                        id="announcementId"
                    >


                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label"
                        >
                            Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            required
                            maxlength="200"
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="content"
                            class="form-label"
                        >
                            Content
                        </label>

                        <textarea
                            class="form-control"
                            id="content"
                            rows="6"
                            required
                        ></textarea>

                    </div>


                    <div
                        id="formError"
                        class="alert alert-danger d-none"
                    ></div>

                </form>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="saveAnnouncement()"
                >
                    Save
                </button>

            </div>

        </div>

    </div>

</div>


<script>

let editingAnnouncementId = null;

let announcementModal;

document.addEventListener("DOMContentLoaded", () => {

    announcementModal = new bootstrap.Modal(
        document.getElementById("announcementModal")
    );

    loadAnnouncements();
});


// ============================================================
// LOAD ANNOUNCEMENTS
// ============================================================

async function loadAnnouncements() {

    const container =
        document.getElementById("announcementContainer");

    try {

        const response =
            await fetch("/api/announcements");

        if (!response.ok) {

            throw new Error(
                "Failed to load announcements"
            );

        }

        const announcements =
            await response.json();

        renderAnnouncements(announcements);

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="alert alert-danger">
                Failed to load announcements.
            </div>
        `;
    }
}


// ============================================================
// RENDER ANNOUNCEMENTS
// ============================================================

function renderAnnouncements(announcements) {

    const container =
        document.getElementById("announcementContainer");


    if (announcements.length === 0) {

        container.innerHTML = `
            <div class="alert alert-info">
                No announcements found.
            </div>
        `;

        return;
    }


    container.innerHTML = announcements.map(
        announcement => `

        <div class="card mb-3 shadow-sm">

            <div class="card-body">

                <div class="d-flex justify-content-between">

                    <div>

                        <h5 class="card-title">
                            ${escapeHtml(announcement.title)}
                        </h5>

                        <small class="text-muted">
                            Created:
                            ${formatDate(announcement.created_at)}
                        </small>

                    </div>


                    <div>

                        <button
                            class="btn btn-sm btn-outline-primary me-1"
                            onclick="editAnnouncement(
                                ${announcement.id}
                            )"
                        >
                            Edit
                        </button>

                        <button
                            class="btn btn-sm btn-outline-danger"
                            onclick="deleteAnnouncement(
                                ${announcement.id}
                            )"
                        >
                            Delete
                        </button>

                    </div>

                </div>


                <hr>


                <p class="card-text">
                    ${escapeHtml(announcement.content)}
                </p>

            </div>

        </div>

    `
    ).join("");
}


// ============================================================
// OPEN CREATE MODAL
// ============================================================

function openCreateModal() {

    editingAnnouncementId = null;

    document.getElementById("modalTitle").textContent =
        "Create Announcement";

    document.getElementById("announcementId").value = "";

    document.getElementById("title").value = "";

    document.getElementById("content").value = "";

    hideError();

    announcementModal.show();
}


// ============================================================
// EDIT ANNOUNCEMENT
// ============================================================

async function editAnnouncement(id) {

    try {

        const response =
            await fetch(`/api/announcements/${id}`);

        if (!response.ok) {

            throw new Error(
                "Failed to get announcement"
            );

        }

        const announcement =
            await response.json();


        editingAnnouncementId = id;


        document.getElementById("modalTitle").textContent =
            "Edit Announcement";

        document.getElementById("announcementId").value =
            id;

        document.getElementById("title").value =
            announcement.title;

        document.getElementById("content").value =
            announcement.content;


        hideError();

        announcementModal.show();

    } catch (error) {

        console.error(error);

        alert(
            "Failed to load announcement."
        );
    }
}


// ============================================================
// SAVE ANNOUNCEMENT
// ============================================================

async function saveAnnouncement() {

    const title =
        document.getElementById("title").value.trim();

    const content =
        document.getElementById("content").value.trim();


    if (!title || !content) {

        showError(
            "Title and content are required."
        );

        return;
    }


    const payload = {
        title: title,
        content: content
    };


    try {

        let response;


        // CREATE
        if (editingAnnouncementId === null) {

            response = await fetch(
                "/api/announcements",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(payload)
                }
            );

        }


        // UPDATE
        else {

            response = await fetch(
                `/api/announcements/${editingAnnouncementId}`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(payload)
                }
            );

        }


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Failed to save announcement"
            );

        }


        announcementModal.hide();

        await loadAnnouncements();


    } catch (error) {

        console.error(error);

        showError(error.message);
    }
}


// ============================================================
// DELETE ANNOUNCEMENT
// ============================================================

async function deleteAnnouncement(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this announcement?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/announcements/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Failed to delete announcement"
            );

        }


        await loadAnnouncements();


    } catch (error) {

        console.error(error);

        alert(
            error.message
        );
    }
}


// ============================================================
// ERROR
// ============================================================

function showError(message) {

    const error =
        document.getElementById("formError");

    error.textContent = message;

    error.classList.remove("d-none");
}


function hideError() {

    const error =
        document.getElementById("formError");

    error.textContent = "";

    error.classList.add("d-none");
}


// ============================================================
// DATE
// ============================================================

function formatDate(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleString();
}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


// ============================================================
// INITIAL LOAD
// ============================================================



</script>

{% endblock %}
